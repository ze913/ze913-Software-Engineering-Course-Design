spring.application.name=lostfound

# ============ 数据源（MySQL） ============
# 本地开发默认值；部署时用环境变量覆盖（护密合规：密码绝不进仓库/配置）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lostfound?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ MyBatis ============
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 日志：MyBatis SQL 输出（开发期排查用）
logging.level.com.zez.lostfound.mapper=debug
