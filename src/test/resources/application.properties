# 测试环境：H2 内存库（MySQL 兼容模式），CI 无需 MySQL 服务即可跑全部测试
spring.datasource.url=jdbc:h2:mem:todolist;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 每次测试上下文启动时执行建表脚本（放在 src/test/resources/schema.sql）
spring.sql.init.mode=always
