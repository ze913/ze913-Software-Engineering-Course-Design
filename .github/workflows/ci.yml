name: CI

# 铁律：push 自动运行单元测试，红灯禁止合并（配合 main 分支保护）
# 教师评分工具会读取本工作流的运行历史，不要手动 disable
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Maven 构建与测试 (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 编译 + 单元测试 + 集成测试
        run: mvn -B verify --no-transfer-progress

      - name: 上传测试报告（红灯排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
